# E2E: the population choropleth.
#
# This flow exists for one reason unit tests cannot cover: the fill is a MapLibre
# *paint expression*, evaluated inside the native renderer. Jest replaces that renderer
# with a stub (__mocks__/@maplibre/maplibre-react-native.tsx), so a malformed expression
# passes every unit test and then blanks the map on a device. Toggling it on here and
# still finding the map and a working selection is the proof that it parsed.
#
# The camera does not move, so the tap points are the same ones tap-country.yaml pins.
#
#   maestro --device <serial> test .maestro/population-choropleth.yaml
appId: com.boris.geographyapp
---
- launchApp:
    clearState: true

# Every point below is a portrait percentage.
- setOrientation: PORTRAIT

- assertVisible:
    id: 'world-map'

# The flat basemap is the default; the legend only exists in choropleth mode.
- assertNotVisible:
    id: 'population-legend'

- tapOn:
    id: 'toggle-fill-mode'

- assertVisible:
    id: 'population-legend'
- assertVisible: 'People per country'
- assertVisible: 'no data'

# The map must still be there. If the paint expression failed to parse, MapLibre drops
# the layer and this is where it shows.
- assertVisible:
    id: 'world-map'

# Selection still works in choropleth mode - it is marked by an outline rather than the
# orange fill, but the wiring behind it is unchanged. Russia, deep in Siberia.
- tapOn:
    point: '81%,20%'
- assertVisible:
    id: 'country-info-sheet'
- assertVisible: 'Russia'
- assertVisible: 'Moscow'

# The legend sits top-left and the sheet bottom, so both are on screen at once.
- assertVisible:
    id: 'population-legend'

- tapOn:
    id: 'close-info-sheet'
- assertNotVisible:
    id: 'country-info-sheet'

# Back to the flat basemap.
- tapOn:
    id: 'toggle-fill-mode'
- assertNotVisible:
    id: 'population-legend'
- assertVisible:
    id: 'world-map'
