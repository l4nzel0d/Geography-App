# E2E: tap a country, read its facts, dismiss.
#
# Coordinate taps are only deterministic because WorldMap.tsx pins the camera to a
# fixed INITIAL_CENTER / INITIAL_ZOOM on launch. If you change either, re-derive the
# points below by taking a screenshot and measuring.
#
# Pick targets in the INTERIOR of large countries. An earlier version tapped 47%,42%
# and asserted "Libya", but that point sits on the Algeria/Libya border and only
# returned Libya through the old features[0] bug.
#
#   maestro --device <serial> test .maestro/tap-country.yaml
appId: com.boris.geographyapp
---
- launchApp:
    clearState: true

# The app rotates freely now, so the orientation has to be pinned: every point below
# is a portrait percentage. The landscape layout has its own flow.
- setOrientation: PORTRAIT

- assertVisible:
    id: 'world-map'

# Nothing selected on a cold start.
- assertNotVisible:
    id: 'country-info-sheet'

# Russia - the largest unambiguous target on screen, deep in Siberia.
- tapOn:
    point: '81%,20%'

- assertVisible:
    id: 'country-info-sheet'
- assertVisible: 'Russia'
- assertVisible: 'Russian'
- assertVisible: 'Russian ruble.*'
- assertVisible: 'Moscow'

# Selecting another country replaces the contents rather than stacking. Greenland is
# large and sits in the upper-left, which the info sheet never covers.
- tapOn:
    point: '19%,13%'
- assertVisible: 'Greenland'
- assertVisible: 'Nuuk'
- assertNotVisible: 'Moscow'

# Tap the flag to see it full size, over a dimmed screen.
#
# Worth a flow rather than leaving it to Jest: this is a `Modal` composited over a live
# MapLibre surface, and "lays out correctly, paints nothing" over that surface is the most
# expensive bug in the project. Unlike the map labels these are ordinary RN views, so
# Maestro really can see them.
- assertNotVisible:
    id: 'flag-lightbox-frame'
- tapOn:
    id: 'open-flag-lightbox'
- assertVisible:
    id: 'flag-lightbox-frame'

# Tap the scrim by POINT, not by id: Maestro taps an element's centre, and the scrim's
# centre is covered by the flag. Greenland's flag is 2:1, so at this width it occupies
# roughly the middle fifth of the screen and 12% is well clear above it.
- tapOn:
    point: '50%,12%'
- assertNotVisible:
    id: 'flag-lightbox-frame'
# Only the flag closed. The card underneath is untouched.
- assertVisible:
    id: 'country-info-sheet'
- assertVisible: 'Nuuk'

# Explicit close.
- tapOn:
    id: 'close-info-sheet'
- assertNotVisible:
    id: 'country-info-sheet'

# Tapping open ocean deselects. Two regressions are guarded here:
#   1. GeoJSONSource.onPress must call stopPropagation, or Map.onPress clears the
#      selection the instant it is made and nothing ever shows.
#   2. The hitbox must be tight enough that open water yields no candidates, otherwise
#      pickCountry's nearest-coast fallback selects a country instead of deselecting.
# The point must also be above the sheet, which covers the bottom ~half when open.
- tapOn:
    point: '81%,20%'
- assertVisible:
    id: 'country-info-sheet'
- tapOn:
    point: '17%,44%'
- assertNotVisible:
    id: 'country-info-sheet'
